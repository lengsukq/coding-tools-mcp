<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030508" />
    <title>Coding Tools MCP</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 启动前同步恢复主题与调色盘，避免首屏闪烁（与 ThemeToggle.vue / src/lib/palette.ts 一致）
      try {
        var root = document.documentElement;
        var savedTheme = localStorage.getItem("coding-tools-theme");
        var isDark = savedTheme !== "light";
        root.dataset.theme = isDark ? "dark" : "light";
        root.classList.toggle("dark", isDark);
        var savedPalette = localStorage.getItem("coding-tools-palette");
        if (savedPalette) root.dataset.palette = savedPalette;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
