<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 258" width="960" height="258" role="img" aria-labelledby="title desc">
  <title id="title">From intent to delivery</title>
  <desc id="desc">Select an authorized workspace, plan, execute, verify and save history for later conversations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#142c3b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65d6c5"/></marker>
  </defs>
  <rect width="960" height="258" rx="22" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="480" y="35" font-size="25" font-weight="700" fill="#edf5ff">From intent to delivery</text>
    <text x="480" y="62" font-size="17" font-weight="500" fill="#a5fae9">Direct  /  Plan  /  Goal</text>
