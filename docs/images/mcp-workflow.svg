    <text x="105" y="138" font-size="19" font-weight="700" fill="#edf5ff">Workspace</text>
    <text x="105" y="163" font-size="15" font-weight="500" fill="#c2d5e8">Select target</text>
    <path d="M188 136H203" fill="none" stroke="#65d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="207" y="84" width="166" height="105" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="290" y="108" font-size="14" font-weight="700" fill="#a5fae9">02</text>
    <text x="290" y="138" font-size="19" font-weight="700" fill="#edf5ff">Planning</text>
    <text x="290" y="163" font-size="15" font-weight="500" fill="#c2d5e8">Goal / Plan</text>
    <path d="M373 136H388" fill="none" stroke="#65d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="392" y="84" width="166" height="105" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="475" y="108" font-size="14" font-weight="700" fill="#a5fae9">03</text>
    <text x="475" y="138" font-size="19" font-weight="700" fill="#edf5ff">Execution</text>
    <text x="475" y="163" font-size="15" font-weight="500" fill="#c2d5e8">Tools / Task</text>
    <path d="M558 136H573" fill="none" stroke="#65d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="577" y="84" width="166" height="105" rx="12" fill="#183e48" stroke="#65d6c5"/>
    <text x="660" y="108" font-size="14" font-weight="700" fill="#a5fae9">04</text>
    <text x="660" y="138" font-size="19" font-weight="700" fill="#edf5ff">Verification</text>
    <text x="660" y="163" font-size="15" font-weight="500" fill="#c2d5e8">Quality Gate</text>
    <path d="M743 136H758" fill="none" stroke="#65d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="762" y="84" width="166" height="105" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="845" y="108" font-size="14" font-weight="700" fill="#a5fae9">05</text>
