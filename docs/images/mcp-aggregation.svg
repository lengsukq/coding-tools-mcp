    <text x="364" y="101" font-size="13" font-weight="500" fill="#bcd1e6">Antigravity · Gemini CLI</text>

    <rect x="498" y="58" width="196" height="54" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="596" y="81" font-size="16" font-weight="700" fill="#edf5ff">Web AI Clients</text>
    <text x="596" y="101" font-size="13" font-weight="500" fill="#bcd1e6">ChatGPT · claude.ai · Grok</text>

    <rect x="730" y="58" width="196" height="54" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="828" y="81" font-size="16" font-weight="700" fill="#edf5ff">Headless CLI</text>
    <text x="828" y="101" font-size="13" font-weight="500" fill="#bcd1e6">Linux server &amp; scripts</text>

