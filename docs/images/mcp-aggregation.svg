    <rect x="216" y="373" width="528" height="24" rx="12" fill="#122437" stroke="#2f566b"/>
    <text x="480" y="390" font-size="13.5" font-weight="500" fill="#c2d5e8">Per-server isolated connection pools  ·  Secrets never leave SecretStore</text>

    <rect x="34" y="440" width="278" height="84" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="173" y="468" font-size="18" font-weight="700" fill="#edf5ff">Stdio MCP</text>
    <text x="173" y="491" font-size="14" font-weight="500" fill="#a5fae9">npx · uvx · local binaries</text>
    <text x="173" y="511" font-size="13" font-weight="500" fill="#bcd1e6">PATH merge · idle process cleanup</text>

    <rect x="341" y="440" width="278" height="84" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="480" y="468" font-size="18" font-weight="700" fill="#edf5ff">Streamable HTTP</text>
    <text x="480" y="491" font-size="14" font-weight="500" fill="#a5fae9">Remote &amp; local /mcp endpoints</text>
    <text x="480" y="511" font-size="13" font-weight="500" fill="#bcd1e6">Session ID · 404 auto-rehandshake</text>

    <rect x="648" y="440" width="278" height="84" rx="12" fill="#20344c" stroke="#42617d"/>
    <text x="787" y="468" font-size="18" font-weight="700" fill="#edf5ff">Legacy SSE</text>
    <text x="787" y="491" font-size="14" font-weight="500" fill="#a5fae9">GET /sse + POST message</text>
    <text x="787" y="511" font-size="13" font-weight="500" fill="#bcd1e6">Proxy &amp; custom header support</text>

    <text x="480" y="548" font-size="15" font-weight="500" fill="#a5fae9">Runs seamlessly alongside built-in Workspace, Git, Terminal, History &amp; Peer Federation tools</text>
