<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" role="img" aria-labelledby="title desc">
  <title id="title">One Gateway. Every External MCP.</title>
  <desc id="desc">AI harnesses connect to one Coding Tools MCP gateway that aggregates Stdio, Streamable HTTP, and Legacy SSE upstream MCP servers using hybrid Direct and Lazy Proxy modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#142c3b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65d6c5"/></marker>
  </defs>
  <rect width="960" height="564" rx="22" fill="url(#bg)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="480" y="36" font-size="24" font-weight="700" fill="#edf5ff">One Gateway. Every External MCP.</text>

