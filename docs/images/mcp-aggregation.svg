    <path d="M480 128V180" fill="none" stroke="#65d6c5" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="206" y="140" width="548" height="24" rx="12" fill="#122437" stroke="#2f566b"/>
    <text x="480" y="157" font-size="13.5" font-weight="500" fill="#c2d5e8">Single Coding Tools MCP entry  ·  mcp-stdio  /  Streamable HTTP  /  HTTPS</text>

    <rect x="56" y="186" width="848" height="176" rx="14" fill="#183e48" stroke="#65d6c5"/>
    <text x="480" y="216" font-size="22" font-weight="700" fill="#a5fae9">UPSTREAM MCP AGGREGATION HUB</text>
    <text x="480" y="240" font-size="14.5" font-weight="500" fill="#edf5ff">Hybrid per-server exposure  ·  Self-loop guard  ·  Isolated SecretStore  ·  Unified Tool Audit</text>

    <rect x="82" y="257" width="384" height="86" rx="12" fill="#214b57" stroke="#528f94"/>
    <text x="274" y="283" font-size="16" font-weight="700" fill="#a5fae9">Direct Mode  ·  {alias}__{tool}</text>
    <text x="274" y="306" font-size="13.5" font-weight="500" fill="#edf5ff">Auto-normalized ≤64 chars for cross-model safety</text>
    <text x="274" y="327" font-size="13" font-weight="500" fill="#bcd1e6">Best for frequent tools · per-tool disable filter</text>

    <rect x="494" y="257" width="384" height="86" rx="12" fill="#214b57" stroke="#528f94"/>
    <text x="686" y="283" font-size="16" font-weight="700" fill="#a5fae9">Lazy Proxy Mode  ·  3 Meta-Tools</text>
    <text x="686" y="306" font-size="13.5" font-weight="500" fill="#edf5ff">mcp_upstream_list  ·  tools  ·  call</text>
    <text x="686" y="327" font-size="13" font-weight="500" fill="#bcd1e6">Zero context bloat · instant catalog updates</text>

