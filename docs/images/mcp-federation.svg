<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">One MCP. Any compatible harness. Every paired device.</title>
  <desc id="desc">Compatible AI clients connect to a global gateway through stdio or HTTP. The gateway routes authorized workspace tool calls to local and paired devices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#142c3b"/></linearGradient>
