name: macOS Manual Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：上传 DMG 到已存在的 Release，例如 v0.2.1"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 校验版本源与 Release 标签
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="$RELEASE_TAG_INPUT" pnpm run version:check
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG_INPUT}" >> "$GITHUB_OUTPUT"

  build-universal-macos:
    needs: verify-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端
        run: |
          pnpm run check
          pnpm run test:ui

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 构建通用 macOS 应用与 DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: node scripts/build-macos-universal.mjs --bundles app,dmg

      - name: 校验 macOS Universal 双架构、签名与 Info.plist 门禁
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 2 -name '*.app' | head -n 1)"
          bash scripts/verify-macos-bundle.sh --app "$APP"

      - name: 上传 Actions 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: coding-tools-mcp-${{ needs.verify-version.outputs.version }}-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  upload-release:
    if: ${{ inputs.release_tag != '' }}
    needs:
      - verify-version
      - build-universal-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: coding-tools-mcp-${{ needs.verify-version.outputs.version }}-macos-universal
          path: dist/macos

      - name: 上传 DMG 到指定 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-version.outputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/macos/dmg/*.dmg
          --repo "$RELEASE_REPOSITORY"
          --clobber
