# Manual publish to the official MCP Registry via GitHub OIDC (workflow_dispatch).

name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to publish to MCP Registry (e.g. 0.3.9; prereleases are rejected)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate server.json and repository version consistency
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${TARGET_VERSION#v}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "Prerelease ${VERSION} must not be published to the stable MCP Registry" >&2
            exit 1
          fi
          RELEASE_TAG="v${VERSION}" pnpm run version:check
          echo "Publishing MCP Registry metadata for version ${VERSION}"

      - name: Install MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
