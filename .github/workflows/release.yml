name: Desktop & Headless Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要创建或更新的 Release 标签，例如 v0.3.9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: 校验版本源与 Release 标签
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          RELEASE_TAG="$RELEASE_TAG" pnpm run version:check
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端
        run: |
          pnpm run check
          pnpm run test:ui

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 仅构建 Windows NSIS 安装程序
        run: pnpm run tauri build --bundles nsis

      - name: 上传 Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-universal-macos:
    needs: verify-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端
        run: |
          pnpm run check
          pnpm run test:ui

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 仅构建通用版 macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: pnpm run tauri build --target universal-apple-darwin --bundles dmg

      - name: 校验 macOS Universal 双架构、签名与 Info.plist 门禁
        run: |
          set -euo pipefail
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)"
          bash scripts/verify-macos-bundle.sh --dmg "$DMG"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux-headless:
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-headless

      - name: 运行无 UI 核心测试
        working-directory: src-tauri
        run: cargo test --no-default-features --lib --bin coding-tools-mcp --tests --locked

      - name: 构建 Linux Headless (x86_64 & aarch64)
        working-directory: src-tauri
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          cargo build --release --locked --no-default-features --bin coding-tools-mcp --target x86_64-unknown-linux-gnu
          cargo build --release --locked --no-default-features --bin coding-tools-mcp --target aarch64-unknown-linux-gnu
          mkdir -p dist-headless
          tar -C target/x86_64-unknown-linux-gnu/release -czf "dist-headless/coding-tools-mcp-v${VERSION}-linux-x86_64-headless.tar.gz" coding-tools-mcp
          tar -C target/aarch64-unknown-linux-gnu/release -czf "dist-headless/coding-tools-mcp-v${VERSION}-linux-aarch64-headless.tar.gz" coding-tools-mcp
          (cd dist-headless && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: 上传 Linux Headless 压缩包与校验清单
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: |
            src-tauri/dist-headless/*.tar.gz
            src-tauri/dist-headless/SHA256SUMS.txt
          if-no-files-found: error

  build-linux-desktop:
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri Linux 桌面依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-desktop

      - name: 安装前端依赖与校验
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test:ui

      - name: 运行 Linux 桌面 Rust 测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 构建 Linux 桌面安装包 (deb + AppImage)
        run: pnpm run tauri build --bundles deb,appimage

      - name: 上传 Linux 桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish-release:
    needs:
      - verify-version
      - build-windows
      - build-universal-macos
      - build-linux-headless
      - build-linux-desktop
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/windows

      - name: 下载 macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos

      - name: 下载 Linux Headless 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-headless
          path: dist/linux-headless

      - name: 下载 Linux 桌面产物
        uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: dist/linux-desktop

      - name: 创建 Release 并上传全平台安装包
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.verify-version.outputs.release_tag }}
          name: Coding Tools MCP ${{ needs.verify-version.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/macos/*.dmg
            dist/linux-headless/*.tar.gz
            dist/linux-headless/SHA256SUMS.txt
            dist/linux-desktop/*.deb
            dist/linux-desktop/*.AppImage
