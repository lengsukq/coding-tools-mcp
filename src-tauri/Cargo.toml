[package]
name = "coding-tools-mcp-desktop"
version = "0.3.10"
description = "Coding Tools MCP desktop client and headless runtime"
authors = ["Coding Tools MCP Contributors"]
repository = "https://github.com/lengsukq/coding-tools-mcp"
edition = "2021"
rust-version = "1.89"
default-run = "coding-tools-mcp-desktop"

[lib]
name = "coding_tools_mcp_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "coding-tools-mcp-desktop"
path = "src/main.rs"
required-features = ["desktop-ui"]

[[bin]]
name = "coding-tools-mcp"
path = "src/bin/coding-tools-mcp.rs"

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
regex = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
shell-words = "1"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
similar = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
